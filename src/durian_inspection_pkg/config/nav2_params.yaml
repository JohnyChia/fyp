controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    transform_tolerance: 0.5
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["goal_checker"]

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.6
      stateful: True

    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.30
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_linear_accel: 0.8
      max_linear_decel: 0.8
      max_angular_vel: 1.5
      use_collision_detection: True

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.2
      allow_unknown: False
      max_iterations: 200000
      downsample_costmap: False

bt_navigator:
  ros__parameters:
    use_sim_time: True
    bt_xml_filename: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"
    default_server_timeout: 20
    bt_loop_duration: 100
    replan_attempts_max: 10

behavior_server:
  ros__parameters:
    use_sim_time: True
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

global_costmap:
  ros__parameters:
    use_sim_time: True
    update_frequency: 2.0
    publish_frequency: 1.0
    transform_tolerance: 1.0
    global_frame: map
    robot_base_frame: base_footprint
    rolling_window: False
    track_unknown_space: False
    width: 100.0
    height: 100.0
    resolution: 0.05
    robot_radius: 0.35
    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: camera_cloud_source
      camera_cloud_source:
        topic: /camera/points
        data_type: PointCloud2
        sensor_frame: camera_link
        marking: True
        clearing: True    
        obstacle_max_range: 5.0

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.8
      cost_scaling_factor: 5.0

local_costmap:
  ros__parameters:
    use_sim_time: True
    update_frequency: 10.0
    publish_frequency: 5.0
    transform_tolerance: 1.0
    global_frame: odom
    robot_base_frame: base_footprint
    rolling_window: True
    width: 8.0
    height: 8.0
    resolution: 0.05
    robot_radius: 0.35
    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: camera_cloud_source
      camera_cloud_source:
        topic: /camera/points
        data_type: PointCloud2
        marking: True
        clearing: True
        min_obstacle_height: 0.05
        max_obstacle_height: 3.0
        obstacle_max_range: 5.0
        raytrace_range: 6.0

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.70
      cost_scaling_factor: 3.0