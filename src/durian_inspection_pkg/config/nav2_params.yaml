# [新增] 启动时自动设置初始位姿 (Initial Pose)
amcl:
  ros__parameters:
    use_sim_time: True
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 5.0
    transform_tolerance: 3.0
    
    # [核心修复 1]：ROS 2 Humble 必须加这些速度阈值参数，否则 Controller 直接崩溃加载失败！
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # [修复] 这里必须叫 general_goal_checker

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14
      stateful: True

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.30
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.0
      max_angular_vel: 1.5
      use_velocity_scaled_lookahead_dist: False
      use_collision_detection: True

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.2
      allow_unknown: True
      max_iterations: 200000
      downsample_costmap: False

bt_navigator:
  ros__parameters:
    use_sim_time: True
    bt_xml_filename: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"
    default_server_timeout: 20
    bt_loop_duration: 100
    replan_attempts_max: 10

behavior_server:
  ros__parameters:
    use_sim_time: True
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    bond_timeout: 30.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 3.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: True
      track_unknown_space: True
      width: 100
      height: 100
      resolution: 0.05
      robot_radius: 0.35
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 3.0
          obstacle_max_range: 5.0
          raytrace_range: 6.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 3.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: True
      # [核心修复 3]：不能带小数点！
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.35
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 3.0
          obstacle_max_range: 5.0
          raytrace_range: 6.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 2.0